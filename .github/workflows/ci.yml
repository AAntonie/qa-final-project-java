name: CI Pipeline

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # versiune actualizată

      - uses: actions/setup-node@v6 # versiune actualizată
        with:
          node-version: "24"

      - run: mvn test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5 # versiune actualizată

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/qa-final-project-java .

      - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/qa-final-project-java
